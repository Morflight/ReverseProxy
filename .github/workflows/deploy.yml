name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker compose -f docker-compose.yaml config --quiet
      - name: Check encrypted env files exist for all deploy targets
        run: |
          for name in $(jq -r '.[].name' .github/deploy-targets.json); do
            if [ ! -f "envs/${name}.enc.yaml" ]; then
              echo "Missing encrypted env file: envs/${name}.enc.yaml"
              exit 1
            fi
          done
          echo "All encrypted env files present."

  prepare:
    name: Prepare matrix
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: echo "matrix=$(jq -c . .github/deploy-targets.json)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy (${{ matrix.server.name }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    environment: ${{ matrix.server.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SOPS
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.12.2/sops-v3.12.2.linux.amd64
          chmod +x sops-v3.12.2.linux.amd64
          sudo mv sops-v3.12.2.linux.amd64 /usr/local/bin/sops

      - name: Decrypt and extract secrets
        id: ci
        run: |
          sops -d --output-type json "envs/${{ matrix.server.name }}.enc.yaml" > /tmp/decrypted.json
          echo "ssh_host=$(jq -r '.ci.ssh_host' /tmp/decrypted.json)" >> $GITHUB_OUTPUT
          echo "ssh_user=$(jq -r '.ci.ssh_user' /tmp/decrypted.json)" >> $GITHUB_OUTPUT
          SSH_KEY=$(jq -r '.ci.ssh_private_key' /tmp/decrypted.json)
          echo "::add-mask::$SSH_KEY"
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "ssh_key<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$SSH_KEY" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT
          jq -r '.app | to_entries | .[] | .key + "=" + .value' /tmp/decrypted.json > /tmp/app.env
          rm /tmp/decrypted.json
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Deploy code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ci.outputs.ssh_host }}
          username: ${{ steps.ci.outputs.ssh_user }}
          key: ${{ steps.ci.outputs.ssh_key }}
          script: |
            cd ${{ matrix.server.deploy_path }}
            git fetch --tags --force
            git checkout ${{ github.ref_name }}

      - name: Inject env
        run: |
          echo "${{ steps.ci.outputs.ssh_key }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            /tmp/app.env ${{ steps.ci.outputs.ssh_user }}@${{ steps.ci.outputs.ssh_host }}:${{ matrix.server.deploy_path }}/.env
          rm /tmp/deploy_key

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ci.outputs.ssh_host }}
          username: ${{ steps.ci.outputs.ssh_user }}
          key: ${{ steps.ci.outputs.ssh_key }}
          script: |
            cd ${{ matrix.server.deploy_path }}
            make deploy
