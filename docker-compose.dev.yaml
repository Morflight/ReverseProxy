services:
  traefik:
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    environment:
      TRAEFIK_PROVIDERS_DOCKER_DEFAULTRULE: 'Host(`{{ normalize .Name }}.localhost`)'
    labels:
      traefik.enable: "true"
      traefik.http.routers.proxy-dashboard.rule: Host(`traefik.localhost`)
      traefik.http.routers.proxy-dashboard.service: api@internal
  mail:
    image: axllent/mailpit:v1.22.3
    profiles: [mail]
    restart: unless-stopped
    networks:
      reverse-proxy:
        aliases: [mailcatcher]
    labels:
      traefik.enable: "true"
      traefik.http.routers.proxy-mail.rule: Host(`mail.localhost`)
      traefik.http.services.proxy-mail.loadbalancer.server.port: "8025"
